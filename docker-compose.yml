services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: events,sqs
      DEFAULT_REGION: us-east-1
      PERSISTENCE: 0
    volumes:
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
      - localstack:/var/lib/localstack

volumes:
  pgdata:
  localstack:
